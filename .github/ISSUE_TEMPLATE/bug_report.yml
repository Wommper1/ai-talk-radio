name: Bug report
description: Something went wrong while installing, generating or playing a show.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Settings → ...
        2. Studio → topic "..." → Start the show
        3. ...
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `npm run doctor`
      description: Paste the whole output. Remove anything you consider private.
      render: text
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model server and model
      placeholder: e.g. LM Studio 0.3.x with Qwen2.5 7B Instruct Q4_K_M
  - type: dropdown
    id: speech
    attributes:
      label: Speech engine
      options: [Edge TTS, Piper, Windows (SAPI), None]
  - type: textarea
    id: logs
    attributes:
      label: Server log or browser console errors
      render: text
