name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The self-test uses node:sqlite, which needs a recent Node.
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Offline: no network, models, or API keys required.
      - name: Self-test
        run: npm run selftest

      # Playout, fallback, backup and restore, run inside a temporary folder.
      - name: Automation self-test
        run: npm run automation-selftest

      - name: Build
        run: npm run build
